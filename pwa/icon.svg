<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cardápio Premium">
  <defs>
    <!-- Fundo Premium Metálico/Escuro -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Gradiente Dourado Elegante para o Símbolo -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d399" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#9a7b4f" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#d4a373" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo Arredondado Escuro (Squircle) -->
  <rect width="512" height="512" rx="130" fill="url(#bg-grad)" />
  <!-- Borda Sutil -->
  <rect width="508" height="508" x="2" y="2" rx="128" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />

  <!-- Símbolo Minimalista (Cloche/Prato Coberto Premium) -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <g filter="url(#gold-glow)">
      <!-- Prato base -->
      <path d="M 20 230 Q 150 250 280 230 L 290 240 Q 150 260 10 240 Z" fill="url(#gold-grad)" />
      <!-- Tampa Cloche -->
      <path d="M 40 220 Q 150 20 260 220 Z" fill="none" stroke="url(#gold-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Puxador Superior -->
      <circle cx="150" cy="55" r="18" fill="url(#gold-grad)" />
      <!-- Símbolo abstrato central (garfo minimalista) -->
      <path d="M 120 120 L 120 170 M 150 120 L 150 180 M 180 120 L 180 170" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    </g>
  </g>
</svg>
