    <script>
      (function () {
        try {
          var head = document.head || document.getElementsByTagName("head")[0];
          if (!head) return;

          var bust = Date.now();

          var manifest = document.createElement("link");
          manifest.setAttribute("rel", "manifest");
          manifest.id = "dynamic-manifest";
          head.appendChild(manifest);

          var icon = document.createElement("link");
          icon.setAttribute("rel", "icon");
          icon.id = "dynamic-icon";
          icon.setAttribute("href", "/cardapio/pwa/icon-32.png?v=" + bust);
          head.appendChild(icon);

          var apple = document.createElement("link");
          apple.setAttribute("rel", "apple-touch-icon");
          apple.id = "dynamic-apple-icon";
          apple.setAttribute("href", "/cardapio/pwa/icon-192.png?v=" + bust);
          head.appendChild(apple);

          window.deferredPrompt = null;
          window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.deferredPrompt = e;
            var installBtn = document.getElementById("pwa-install-btn");
            if (installBtn) {
              installBtn.classList.remove('is-hidden');
            }
          });

        } catch (e) {}
      })();
    </script>

  <body class="is-loading">
    <header class="hero">
      <div class="hero-content">
        <div>
          <p class="chip">Pedido Rápido por WhatsApp</p>
          <h1 id="cardapio-nome">Carregando cardápio...</h1>
          <button id="owner-edit-btn" class="btn btn-owner-edit is-hidden" type="button">Editar cardápio</button>
          <p id="cardapio-subtitle">Escolha seus itens e finalize em poucos passos.</p>
        </div>
        <div class="hero-media">
          <img id="cardapio-foto" class="is-hidden" alt="" />

          <div id="cardapio-info" class="cardapio-info is-hidden" aria-label="Informações da loja">
            <div id="cardapio-status" class="status is-hidden"></div>
            <p id="cardapio-horario" class="muted is-hidden"></p>
            <p id="cardapio-endereco" class="muted is-hidden"></p>
            <p id="cardapio-pagamentos" class="muted is-hidden"></p>

            <div class="info-links">
              <a id="cardapio-instagram" class="link link-instagram is-hidden" target="_blank" rel="noopener">
                <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                  <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Instagram</span>
              </a>
              <a id="cardapio-maps" class="link link-maps is-hidden" target="_blank" rel="noopener">
                <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span>Como chegar</span>
              </a>
              <a id="cardapio-whatsapp-top" class="link link-whatsapp is-hidden" target="_blank" rel="noopener">
                <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>WhatsApp</span>
              </a>
              <button id="pwa-install-btn" class="link link-pwa is-hidden" type="button">
                <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Instalar App</span>
              </button>
            </div>
            <div id="galeria-wrap" class="galeria-wrap is-hidden" aria-label="Imagens do estabelecimento">
              <div id="galeria" class="galeria-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="search-container">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="produto-search" class="search-input" placeholder="O que você está procurando?" />
        <button type="button" id="voice-search-btn" class="voice-search-btn" title="Pesquisar por voz">🎤</button>
      </div>
      <div class="search-actions">
        <button type="button" id="theme-toggle-btn" class="action-btn" title="Alternar Modo Escuro">🌙</button>
        <button type="button" id="layout-toggle-btn" class="action-btn" title="Mudar Visualização">
          <svg class="layout-icon grid-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <svg class="layout-icon list-icon is-hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <div id="categories" class="categories-container"></div>

    <main class="content-grid">
      <section>
        <div id="produtos" class="produtos-grid">
          <p class="muted">Carregando produtos...</p>
        </div>
      </section>

      <aside class="cart-box">
        <h2>Seu pedido</h2>
        <div id="cart-items" class="cart-items"></div>
        <div class="totals">
          <p id="cart-subtotal" class="muted total-line">
            <span class="total-label" data-label>Subtotal</span>
            <span class="total-value" data-value>R$ 0,00</span>
          </p>
          <p id="cart-taxa" class="muted total-line is-hidden">
            <span class="total-label" data-label>Taxa de entrega</span>
            <span class="total-value" data-value>R$ 0,00</span>
          </p>
          <p id="cart-total" class="cart-total total-line">
            <span class="total-label" data-label>Total</span>
            <span class="total-value" data-value>R$ 0,00</span>
          </p>
          <p id="cart-minimo" class="muted is-hidden"></p>
        </div>

        <form id="checkout-form" class="checkout-form">
          <div class="form-row">
            <label id="tipo-pedido-wrap" class="is-hidden">
              Tipo de pedido
              <select name="tipo_pedido" id="tipo_pedido">
                <option value="entrega">Entrega</option>
                <option value="retirada">Retirada</option>
              </select>
            </label>

            <label id="pagamento-wrap" class="is-hidden">
              Forma de pagamento
              <select name="pagamento" id="pagamento"></select>
            </label>
          </div>

          <div id="agendamento-section" class="is-hidden" style="margin-top: 16px; padding: 16px; background: rgba(var(--theme-rgb, 255, 106, 0), 0.05); border-radius: 12px; border: 1px solid var(--border);">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">📅 Agendar Horário</h3>
            <div class="form-row">
              <label>
                Data
                <input type="date" id="agendamento-data" name="agendamento_data" />
              </label>
              <label>
                Horário
                <select id="agendamento-hora" name="agendamento_hora">
                  <option value="">Selecione a data primeiro</option>
                </select>
              </label>
            </div>
          </div>

          <div class="form-row">
            <label>
              Nome completo
              <input type="text" name="nome" placeholder="Ex.: João da Silva" autocomplete="name" required />
            </label>

            <label>
              Telefone
              <input
                type="text"
                name="telefone"
                id="telefone"
                placeholder="(11) 99999-9999"
                autocomplete="tel"
                inputmode="tel"
                required
              />
            </label>
          </div>

          <label id="endereco-wrap">
            Endereço completo
            <textarea
              name="endereco"
              rows="3"
              placeholder="Rua, número, bairro, complemento"
              autocomplete="street-address"
              required
            ></textarea>
          </label>

          <button class="btn btn-primary" type="submit">Finalizar pedido</button>
        </form>

        <p id="checkout-message" class="checkout-message" aria-live="polite"></p>
      </aside>
    </main>

    <a id="whatsapp-fab" class="whatsapp-fab is-hidden" target="_blank" rel="noopener">WhatsApp</a>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
      <div class="lightbox-content">
        <button type="button" class="lightbox-close" aria-label="Fechar">×</button>
        <img id="lightbox-image" class="lightbox-image" src="" alt="" />
      </div>
    </div>

    <link rel="modulepreload" href="/cardapio/cardapio/script.js?v=40" />
    <script type="module" src="/cardapio/cardapio/script.js?v=40"></script>
  </body>
</html>
