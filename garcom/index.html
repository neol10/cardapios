  <body class="is-loading">
    <header class="hero">
      <div class="hero-content">
        <div>
          <p class="chip">Bloco de Notas do Garçom</p>
          <h1 id="cardapio-nome">Carregando cardápio...</h1>
          <p id="cardapio-subtitle">Anote pedidos rapidamente por mesa.</p>
        </div>
        <div class="hero-media">
          <img id="cardapio-foto" class="is-hidden" alt="" />
          <button id="fullscreen-btn" class="btn btn-secondary" type="button">🖥️ Tela Cheia</button>
        </div>
      </div>
    </header>

    <main class="content-grid">
      <section>
        <!-- Mesa atual -->
        <div class="mesa-selector">
          <label>
            Número da Mesa
            <input type="number" id="numero-mesa" min="1" max="999" placeholder="Ex: 1" />
          </label>
          <button id="nova-mesa-btn" class="btn btn-secondary">Nova Mesa</button>
        </div>

        <!-- Produtos -->
        <div id="produtos" class="produtos-grid">
          <p class="muted">Carregando produtos...</p>
        </div>
      </section>

      <!-- Pedidos da mesa atual -->
      <aside class="pedidos-box">

        <section id="mesa-detalhes" class="panel is-hidden">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2 id="mesa-titulo">Mesa <span id="mesa-atual">-</span></h2>
            <button class="btn btn-ghost" id="fechar-detalhes">Voltar</button>
          </div>

          <details class="details" style="margin-bottom: 12px; background: rgba(0,0,0,0.2);">
            <summary>🧮 Dividir Conta</summary>
            <div class="calculator-card" style="padding: 12px;">
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <label>
                  <span class="muted" style="font-size:0.75rem;">Total</span>
                  <input type="text" id="calc-total" readonly style="background:rgba(255,255,255,0.05); font-weight:800;">
                </label>
                <label>
                  <span class="muted" style="font-size:0.75rem;">Pessoas</span>
                  <input type="number" id="calc-pessoas" value="1" min="1" step="1">
                </label>
              </div>
              <div style="margin-top:12px; padding:12px; background:rgba(128,128,128,0.1); border-radius:12px; text-align:center;">
                <span class="muted">Valor por pessoa:</span>
                <strong id="calc-resultado" style="display:block; font-size:1.5rem; color:var(--primary);">R$ 0,00</strong>
              </div>
            </div>
          </details>

          <div id="pedidos-mesa" class="pedidos-mesa">
            <p class="muted">Selecione uma mesa ou adicione produtos.</p>
          </div>
        </section>
        
        <div class="mesa-actions">
          <button id="limpar-mesa-btn" class="btn btn-ghost">Limpar Mesa</button>
          <button id="finalizar-mesa-btn" class="btn btn-primary">Finalizar Mesa</button>
        </div>

        <details class="details" id="mesas-abertas" open>
          <summary>Mesas Abertas (<span id="count-mesas">0</span>)</summary>
          <div id="lista-mesas" class="mesas-list">
            <p class="muted">Nenhuma mesa aberta.</p>
          </div>
        </details>
      </aside>
    </main>

    <link rel="modulepreload" href="./script.js?v=1" />
    <script type="module" src="./script.js?v=1"></script>
  </body>
